<head>

<!-- Preconnect -->

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<!-- Fonts optimizadas -->

<!-- CSS -->

<!-- Preload imagen principal -->

<!-- HubSpot defer -->

<!-- CSS crítico mínimo -->
<style>
body{margin:0;font-family:'Space Grotesk',sans-serif;background:#0a1628;color:#fff}
img{max-width:100%;height:auto}
</style>

</head>

<body>

<!-- GTM noscript -->
<noscript>
<iframe src="https://www.googletagmanager.com/ns.html?id=GTM-PMNPBKTX"
height="0" width="0" style="display:none;visibility:hidden"></iframe>
</noscript>

<header>
<nav>
<a href="#" class="nav-logo">
<img src="assets/images/Buho.png"
alt="Logo Tuttor-Up"
width="40" height="40"
loading="eager">
TUTTOR-UP
</a>
</nav>
</header>

<!-- HERO -->
<section id="hero">
<h1>Aprende sin límites</h1>
<p>Plataforma educativa 24/7</p>

<img src="assets/images/Buho.png"
alt="Búho Tuttor-Up"
width="110" height="110"
loading="eager"
fetchpriority="high">
</section>

<!-- BENEFICIOS -->
<section id="beneficios">
<h2>Beneficios</h2>

<img src="assets/images/Buho.png"
alt="Icono educación"
loading="lazy"
width="80" height="80">
</section>

<!-- FORM -->
<section id="cta2">
<div class="hs-form-frame"
data-region="na1"
data-form-id="98cd997f-f41b-462b-960c-1bbdf62d3bf1"
data-portal-id="51296735"></div>
</section>

<!-- SCRIPTS OPTIMIZADOS -->
<script defer>

// Toggle menú
document.querySelector('.nav-toggle')?.addEventListener('click', e=>{
const btn=e.currentTarget;
btn.setAttribute('aria-expanded',btn.getAttribute('aria-expanded')==='true'?'false':'true');
document.querySelector('header').classList.toggle('nav-open');
});

// FAQ accesible
function toggleFaq(el){
const item=el.closest('.faq-item');
item.classList.toggle('open');
}

// Scroll suave eficiente
document.querySelectorAll('a[href^="#"]').forEach(a=>{
a.addEventListener('click',e=>{
const target=document.querySelector(a.getAttribute('href'));
if(target){
e.preventDefault();
target.scrollIntoView({behavior:'smooth'});
}
});
});

</script>

<!-- HubSpot async final -->
<script async defer src="//js.hs-scripts.com/51296735.js"></script>

</body>
</html>
